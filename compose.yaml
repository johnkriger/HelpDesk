
services:
  app:
    build: .
    container_name: helpdesk_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_DATABASE: helpdesk
      DB_USERNAME: helpdesk
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - db

  db:
    image: mariadb:11.8
    container_name: helpdesk_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: helpdesk
      MARIADB_USER: helpdesk
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - helpdesk_db_data:/var/lib/mysql

volumes:
  helpdesk_db_data:
