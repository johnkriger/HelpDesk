
services:
  db:
    image: mariadb:11.8
    container_name: helpdesk_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: helpdesk
      MARIADB_USER: helpdesk
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - helpdesk_db_data:/var/lib/mysql

volumes:
  helpdesk_db_data:
